services:
  - type: web
    name: signal-lite-chat-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore # Hoặc oregon / frankfurt
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: signal-lite-db
          property: connectionString
      - key: REDIS_ADDR
        fromService:
          type: redis
          name: signal-lite-redis
          property: connectionString

databases:
  - name: signal-lite-db
    plan: free
    databaseName: chat_db
    user: postgres
    region: singapore

  - type: redis
    name: signal-lite-redis
    plan: free
    ipAllowList: []
    region: singapore
